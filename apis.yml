aid: genomatica
name: Genomatica
description: 'Genomatica (which markets itself as Geno) is a San Diego, California
  biotechnology and sustainable materials company founded in 1998 that engineers microbes
  and fermentation processes to make widely used chemical building blocks from plants
  instead of fossil fuels. Its commercialized process technology covers Geno BDO (bio-based
  1,4-butanediol, licensed to partners including BASF and Novamont), Brontide butylene
  glycol for personal care, Avela (R)-1,3-butanediol, plant-based nylon-6 intermediates
  developed with lululemon and manufacturing partners such as Hyosung and Sojitz, plus
  palm-oil alternatives and fragrance building blocks. Genomatica licenses its process
  technology to chemical producers rather than operating a software platform; as of
  this profile it publishes no public developer portal, API documentation, machine-readable
  specification, or agent-facing discovery surface.'
